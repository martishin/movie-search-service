apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-api
  namespace: movie-search
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ms-api.martishin.com
      secretName: ms-api-tls
  rules:
    - host: ms-api.martishin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: movie-search-server
                port:
                  number: 80
